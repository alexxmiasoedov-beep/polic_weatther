name: Collect weather market prices
# schedule re-registered 2026-08-27; 06.10 — непрерывный цикл

# Репозиторий ПУБЛИЧНЫЙ с 07.09 — минуты Actions бесплатны без лимита.
#
# 06.10 (владелец: «данные должны собираться в фоне»). Планировщик
# GitHub при сетке «каждые 10 минут» реально запускал сбор 6-8 раз в
# сутки — расписание на :05/:15/… он просто пропускал. Поэтому теперь
# одна задача живёт ~5 ч 50 мин и внутри себя собирает каждые 10 минут,
# а расписание лишь поставляет следующую задачу в очередь: группа
# concurrency держит одну рабочую и одну ожидающую, ожидающая стартует
# сразу после окончания рабочей. Даже если GitHub пропустит пять
# запусков из шести, покрытие остаётся непрерывным.
#
# Внутри цикла: collector.py (цены PM/Kalshi, модели wx на каждом
# запуске, пилоты, обзор 41 города, часовые METAR всех станций) ->
# commit -> pull --rebase (jsonl сливаются объединением строк, см.
# .gitattributes) -> push.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    permissions:
      contents: write
      actions: write   # самозапуск следующего цикла (workflow_dispatch)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect loop (every 10 min for ~5h50m)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "weather-collector"
          git config user.email "actions@users.noreply.github.com"
          START=$(date +%s)
          LIMIT=$((350 * 60))
          while true; do
            TICK=$(date +%s)
            git pull --rebase -q || true
            timeout 480 python collector.py || echo "WARN: collector rc=$?"
            git add data/ pilot_data/ observe_data/ metar_data/ observe_cities.json
            if ! git diff --cached --quiet; then
              git commit -qm "snapshot $(date -u +'%Y-%m-%d %H:%M') UTC"
              for i in 1 2 3 4; do
                git push -q && break
                git pull --rebase -q || true
                sleep $((i * 3))
              done
            fi
            NOW=$(date +%s)
            if [ $((NOW - START)) -ge $LIMIT ]; then
              echo "цикл завершён: $(( (NOW - START) / 60 )) мин"
              break
            fi
            # Эстафета (06.10 12:30): планировщик GitHub пропускает и
            # ежечасные слоты (12:07 не встал в очередь), поэтому за
            # ~12 минут до конца цикл сам ставит в очередь следующий
            # запуск — он ждёт в группе concurrency и стартует сразу
            # после завершения этого. Расписание остаётся запасным.
            if [ -z "$CHAINED" ] && [ $((NOW - START)) -ge $((LIMIT - 720)) ]; then
              curl -sS -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/collect.yml/dispatches" \
                -d '{"ref":"main"}' && CHAINED=1 && echo "следующий цикл поставлен в очередь"
            fi
            # ждём до следующей 10-минутной отметки от начала итерации
            SLEEP=$((600 - (NOW - TICK)))
            [ $SLEEP -gt 0 ] && sleep $SLEEP
          done
