name: Collect weather market prices
# schedule re-registered 2026-08-27

# Репозиторий ПУБЛИЧНЫЙ с 07.09 — минуты Actions бесплатны без лимита.
# Сетка: цены каждые 10 минут круглосуточно; погода (wx) — раз в час
# (:05); обзорный сбор всех городов PM — каждые полчаса (:05, :35).
# Логика внутри collector.py по минуте запуска.
on:
  schedule:
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect snapshot
        run: python collector.py

      - name: Commit and push
        run: |
          git config user.name "weather-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/ pilot_data/ observe_data/ observe_cities.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "snapshot $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase
            sleep $((i * 2))
          done
          exit 1
